name: 自动测试

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 运行全部自动测试
        run: python -m unittest -v
